# Flexbox playground for developing and trying pathviz:
#
#   dev    (172.16.0.10) - Go toolchain and the sources, also the external traffic source
#   target (172.16.0.20) - the machine whose netfilter hooks are visualized
#
# Start it with: labctl playground start flexbox -f playground.yaml
kind: playground
name: flexbox
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: dev
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: golang
          mount: /
          size: 30GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.10/24
      resources:
        cpuCount: 4
        ramSize: 4GiB
    - name: target
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: ubuntu-24-04
          mount: /
          size: 20GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.20/24
      resources:
        cpuCount: 2
        ramSize: 2GiB
  tabs:
    - id: terminal-dev
      kind: terminal
      name: dev
      machine: dev
    - id: terminal-target
      kind: terminal
      name: target
      machine: target
    - id: pathviz
      kind: http-port
      name: pathviz
      machine: target
      number: 7070
